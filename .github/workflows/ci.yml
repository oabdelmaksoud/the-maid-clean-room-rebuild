name: Portable evidence toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/delimited-notebook/run_demo.py --output "${{ runner.temp }}/behavior-demo"
      - run: python skills/behavior-rebuild/scripts/validate.py "${{ runner.temp }}/behavior-demo" --stage acceptance --run runs/demo.json --candidate demo-v1 --json
      - run: python tools/build_release.py --output "${{ runner.temp }}/behavior-release"
